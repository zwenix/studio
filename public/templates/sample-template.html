<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Classroom Template</title>
    <style>
        body { font-family: 'Comic Neue', cursive; padding: 40px; color: #1e293b; }
        .header { border-bottom: 4px solid #3b82f6; padding-bottom: 10px; margin-bottom: 20px; }
        .box { border: 2px dashed #94a3b8; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to Your New Lesson! 🚀</h1>
    </div>
    <div class="box">
        <p>This is a sample template hosted directly on your Firebase Hosting. You can edit this file or add new ones to your project's <code>public/templates</code> folder.</p>
    </div>
</body>
</html>
