firebase: {}

runConfig:
  memoryMiB: 1024
  cpu: 1
  maxInstances: 4
  minInstances: 0
  # CRITICAL: API key must be available at RUNTIME (not just build time).
  # Without this, all server-side ai.generate() calls fail with auth errors.
  env:
    - variable: GOOGLE_GENAI_API_KEY
      secret: GOOGLE_GENAI_API_KEY

buildConfig:
  env:
    - variable: NODE_OPTIONS
      value: "--max-old-space-size=4096"
    - variable: GOOGLE_GENAI_API_KEY
      secret: GOOGLE_GENAI_API_KEY